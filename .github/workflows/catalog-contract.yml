name: Catalog contract

# Live check that LeetCode's problemset schema still matches our query
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Run catalog contract check
        run: npx tsx scripts/catalog-contract.ts
        working-directory: server
